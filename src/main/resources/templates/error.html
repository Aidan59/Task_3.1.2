<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="'Error ' + ${status}">Error</title>
    <style>
        :root {
            --bg: #f3f5f7;
            --panel: #ffffff;
            --text: #1f2933;
            --muted: #6b7785;
            --line: #dde3ea;
            --accent: #2f6f6d;
            --accent-dark: #245654;
            --danger: #b4443a;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #14181c;
                --panel: #1c2228;
                --text: #e6ebf0;
                --muted: #93a0ad;
                --line: #2d363f;
                --accent: #4fa7a3;
                --accent-dark: #67bdb9;
                --danger: #e0766b;
            }
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            background: var(--bg);
            color: var(--text);
            font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
            line-height: 1.5;
        }
        .card {
            width: 100%;
            max-width: 460px;
            text-align: center;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 36px 28px;
        }
        .code { font-size: 4rem; font-weight: 700; line-height: 1; color: var(--danger); margin: 0 0 8px; }
        h1 { font-size: 1.4rem; margin: 0 0 8px; }
        p { margin: 0 0 8px; color: var(--muted); }
        .detail { font-size: .85rem; word-break: break-word; }
    </style>
</head>
<body>
<main class="card">
    <p class="code" th:text="${status}">500</p>

    <h1 th:switch="${status}">
        <span th:case="403">Access denied</span>
        <span th:case="404">Page not found</span>
        <span th:case="400">Bad request</span>
        <span th:case="405">Method not allowed</span>
        <span th:case="*">Something went wrong</span>
    </h1>

    <p th:switch="${status}">
        <span th:case="403">You don't have permission to view this page.</span>
        <span th:case="404">The page you are looking for doesn't exist or was moved.</span>
        <span th:case="*">The request could not be completed. Please try again.</span>
    </p>

    <p class="detail" th:if="${message != null and !#strings.isEmpty(message)}" th:text="${message}">Details</p>
    <p class="detail" th:if="${path != null}" th:text="${path}">/path</p>

</main>
</body>
</html>
