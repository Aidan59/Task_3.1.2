<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in</title>
    <style>
        :root {
            --bg: #f3f5f7;
            --panel: #ffffff;
            --text: #1f2933;
            --muted: #6b7785;
            --line: #dde3ea;
            --accent: #2f6f6d;
            --accent-dark: #245654;
            --danger: #b4443a;
            --ok: #2f6f4a;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #14181c;
                --panel: #1c2228;
                --text: #e6ebf0;
                --muted: #93a0ad;
                --line: #2d363f;
                --accent: #4fa7a3;
                --accent-dark: #67bdb9;
                --danger: #e0766b;
                --ok: #6fc28f;
            }
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            background: var(--bg);
            color: var(--text);
            font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
            line-height: 1.5;
        }
        .card {
            width: 100%;
            max-width: 380px;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 28px;
        }
        h1 { font-size: 1.5rem; margin: 0 0 4px; }
        .sub { color: var(--muted); margin: 0 0 20px; }
        label { display: block; font-size: .85rem; color: var(--muted); margin-bottom: 4px; }
        .field { margin-bottom: 14px; }
        input {
            width: 100%;
            padding: 10px;
            font: inherit;
            color: var(--text);
            background: var(--bg);
            border: 1px solid var(--line);
            border-radius: 6px;
        }
        input:focus, .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
        .btn {
            width: 100%;
            margin-top: 6px;
            padding: 10px;
            font: inherit;
            font-weight: 600;
            color: #fff;
            background: var(--accent);
            border: 1px solid var(--accent);
            border-radius: 6px;
            cursor: pointer;
        }
        .btn:hover { background: var(--accent-dark); border-color: var(--accent-dark); }
        .msg { margin: 0 0 16px; padding: 10px 12px; border-radius: 6px; font-size: .9rem; border: 1px solid; }
        .msg.error { color: var(--danger); border-color: var(--danger); }
        .msg.ok { color: var(--ok); border-color: var(--ok); }
    </style>
</head>
<body>
<main class="card">
    <h1>Sign in</h1>
    <p class="sub">Enter your username and password to continue.</p>

    <p class="msg error" th:if="${param.error}">Wrong username or password.</p>
    <p class="msg ok" th:if="${param.logout}">You have been signed out.</p>

    <!-- th:action adds the CSRF token automatically -->
    <form th:action="@{/login}" method="post">
        <div class="field">
            <label for="email">Username</label>
            <input id="email" type="email" name="username" autocomplete="username" required autofocus>
        </div>
        <div class="field">
            <label for="password">Password</label>
            <input id="password" type="password" name="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn">Sign in</button>
    </form>
</main>
</body>
</html>
